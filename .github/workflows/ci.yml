name: CI

# Wymagane checki (ochrona gałęzi main): check, functions, migrations, images, compat-n-1, secrets.
# Akcje przypięte po pełnym SHA (Renovate/Dependabot podbija SHA razem z komentarzem wersji).
# CI nie ma sekretów i niczego nie publikuje; release.yml buduje obrazy wydania.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Wersja pnpm z pola packageManager w package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm exec tsc -p api
      - run: pnpm exec tsc -p server
      - run: pnpm lint
      - run: pnpm test
      # Polityka Auth VPS (supabase/selfhost/auth-policy.json) zgodna z scripts/instances/policy.mjs.
      - run: node scripts/instances/auth-policy.mjs --check
      # Tryb Vercel: CSP instancji powstaje z VITE_SUPABASE_URL (vite.config.ts) - w CI atrapa.
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
      # Tryb VPS (obraz app): konfiguracja z /runtime-config.js, serwer Node z build/.
      - run: pnpm exec vite build && pnpm build:server
        env:
          LEGATTO_TARGET: selfhost
      - run: pnpm audit --prod --audit-level high

  functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - run: scripts/ci/deno-check.sh

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tagi v* (poprzednie wydanie dla etapu contract).
          fetch-depth: 0
          persist-credentials: false
      - run: node scripts/lint-migrations.mjs
      # Obraz migratora na stosie jak na VPS (auth i storage przed migratorem):
      # migrate → check → drugi migrate bez zmian w schemacie → zmieniony plik = kod 10.
      - run: scripts/ci/test-migrator.sh
      # Testy SQL funkcji (A5-A8, A12, A13) na świeżej bazie.
      - run: supabase/tests/run-features.sh

  compat-n-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      # Migracje N na bazie po migracjach N-1; obiekty używane przez kod N-1 muszą przetrwać,
      # testy SQL N-1 przechodzą na schemacie N.
      - run: scripts/ci/compat-n-1.sh

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: scripts/ci/install-syft.sh "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build images (app, functions, migrator) + release.json + SBOM
        run: |
          version="$(node -p 'require("./package.json").version')"
          scripts/release/build-images.sh --version "$version" --out "$RUNNER_TEMP/release" --platform linux/amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-ci
          path: |
            ${{ runner.temp }}/release/release.json
            ${{ runner.temp }}/release/digests.json
            ${{ runner.temp }}/release/sbom/
          if-no-files-found: error
          retention-days: 14

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (historia git)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . --config .gitleaks.toml --redact --verbose --exit-code 1
